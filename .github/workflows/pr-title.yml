name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  pull-requests: read

jobs:
  title:
    name: Reject WIP title
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          shopt -s nocasematch
          if [[ "$PR_TITLE" == *"[WIP]"* ]]; then
            echo "PR titles must not contain [WIP] when ready to merge."
            exit 1
          fi
