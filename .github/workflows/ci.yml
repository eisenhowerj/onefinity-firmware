name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Svelte check, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/svelte-components/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: npm run lint

      - name: Check Svelte components
        run: npm run check --prefix src/svelte-components

      - name: Test JavaScript and Svelte
        run: npm test

      - name: Test Python
        run: python -m pytest

  avr-build:
    name: AVR build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr

      - name: Build AVR firmware
        run: make -C src/avr
