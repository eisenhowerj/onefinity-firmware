name: Dependency Update

# Automatically checks for and updates outdated dependencies on a weekly
# schedule, opening a pull request with the changes for review.
#
# This workflow complements (does not duplicate) Dependabot
# (.github/dependabot.yml): Dependabot opens one PR per ecosystem/update,
# while this workflow batches npm-check-updates / pip-compile results into a
# single PR per ecosystem so the maintainer can review a broader refresh at
# once. It runs a few hours after Dependabot's Monday run so any updates
# Dependabot already opened PRs for can be reviewed first; if both produce
# overlapping changes, simply close the duplicate PR.
#
# Note: PRs are created using the default GITHUB_TOKEN, which (by GitHub
# design) does not trigger other workflows (e.g. CI checks) on the resulting
# PR. If automatic CI runs on these PRs are required, configure a
# repository/organization PAT or GitHub App token and pass it as the `token`
# input below instead.
on:
  schedule:
    # Every Monday at 09:00 UTC (Dependabot runs at 04:00 UTC, see
    # .github/dependabot.yml).
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-npm:
    name: Update npm dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            directory: "."
            branch: chore/npm-update-root
            title: "chore(deps): update root npm dependencies"
          - name: svelte-components
            directory: "src/svelte-components"
            branch: chore/npm-update-svelte-components
            title: "chore(deps): update svelte-components npm dependencies"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update dependencies with npm-check-updates
        working-directory: ${{ matrix.directory }}
        # Limited to minor/patch bumps so this unattended, weekly job stays
        # low-risk; major version bumps (which often need code changes) are
        # left for Dependabot PRs or manual review instead.
        run: |
          npx --yes npm-check-updates --target minor -u
          npm install --package-lock-only

      # create-pull-request detects whether npm-check-updates left any
      # working-tree changes and automatically skips creating a PR (and
      # skips updating an existing one with no new changes) when there is
      # nothing to commit, so "no updates available" weeks don't produce
      # empty/no-op PRs.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ matrix.title }}"
          branch: ${{ matrix.branch }}
          delete-branch: true
          title: "${{ matrix.title }}"
          labels: |
            dependencies
            npm
            automated
          body: |
            Automated dependency update for the `${{ matrix.name }}` npm
            project, generated by `npm-check-updates` in the
            `dependency-update.yml` workflow.

            Please review the changes, run the relevant build/lint checks,
            and merge if everything passes.

  update-python:
    name: Update Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-tools
        run: python -m pip install --upgrade pip pip-tools

      - name: Update requirements with pip-compile
        # GitHub Actions runs `run:` steps with `bash --noprofile --norc -eo
        # pipefail`, so pip-compile errors (e.g. unresolvable constraints)
        # already abort the job before the PR step runs.
        run: |
          pip-compile --upgrade --output-file=requirements.txt requirements.in
          pip-compile --upgrade --output-file=requirements-dev.txt requirements-dev.in

      # See the note on the npm job's Create Pull Request step: this action
      # skips creating/updating a PR when pip-compile made no changes.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update python dependencies"
          branch: chore/python-deps-update
          delete-branch: true
          title: "chore(deps): update python dependencies"
          labels: |
            dependencies
            python
            automated
          body: |
            Automated dependency update for the Python requirements files,
            generated by `pip-compile` (pip-tools) in the
            `dependency-update.yml` workflow.

            Please review the changes, run the relevant tests, and merge if
            everything passes.
